# WebSocket connection-upgrade map — lets Nginx correctly forward the Upgrade /
# Connection headers to the Laravel Reverb WebSocket server.
# NOTE: `map` and `upstream` are valid here because this file is included
# inside the `http {}` block of nginx.conf (via /etc/nginx/conf.d/*.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Docker's embedded DNS — enables request-time hostname resolution for the
# variable-based proxy_pass below, so Nginx starts even before the `reverb`
# container is running (avoids "host not found in upstream" startup crashes).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Tenant-ID       $http_x_tenant_id;

    # --- Laravel Reverb WebSocket reverse-proxy ---
    # /app — WebSocket endpoint used by Pusher/Echo clients (ws://host/app/{key})
    location /app {
        set $reverb_backend http://reverb:8000;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # /apps — Pusher-compatible HTTP API (used by the Reverb broadcaster/triggers)
    location /apps {
        set $reverb_backend http://reverb:8000;
        proxy_pass $reverb_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        include fastcgi_params; # MOVED UP: Loaded first to establish baseline system variables
        fastcgi_read_timeout 300;

        # FIXED: Declared last to prevent fastcgi_params from overwriting our multi-tenant identity token
        fastcgi_param HTTP_X_TENANT_ID $http_x_tenant_id;
        fastcgi_pass_header X-Tenant-ID;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
