name: logiflow-prod

networks:
  logiflow-network:
    name: logiflow-network
    driver: bridge

volumes:
  postgres-data:
    name: logiflow-prod-postgres-data
  redis-data:
    name: logiflow-prod-redis-data
  minio-data:
    name: logiflow-prod-minio-data

services:
  # ---------------------------------------------------------------------------
  # FRONTEND — Next.js Standalone Production Build (Zero Host Bind-Mounts)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: production # FIXED: Target production image multi-stage layout
    image: logiflow/frontend:prod
    container_name: logiflow-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000" # FIXED: Hidden from host network, only Nginx routes traffic here
    depends_on:
      webserver:
        condition: service_healthy
    networks:
      - logiflow-network

  # ---------------------------------------------------------------------------
  # BACKEND — Laravel Headless Production API (PHP-FPM, No Dev Dependencies)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: production # FIXED: Strips Composer dev-tools, injects OPcache
    image: logiflow/backend:prod
    container_name: logiflow-backend-prod
    restart: always
    expose:
      - "9000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false" # FIXED: Forced debug shutdown for production error safety
      APP_URL: ${APP_URL}
      LOG_CHANNEL: stack
      LOG_LEVEL: error

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"

      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow-network

  # ---------------------------------------------------------------------------
  # WEBSERVER — Public Ingress Controller Gateway (The Only Public Port)
  # ---------------------------------------------------------------------------
  webserver:
    image: nginx:1.27-alpine
    container_name: logiflow-webserver-prod
    restart: always
    volumes:
      - ./nginx/prod.conf.d:/etc/nginx/conf.d:ro # Fixed: Production proxy setup
    ports:
      - "80:80" # Production HTTP Port Entrypoint
      - "443:443" # Production HTTPS Secure Port Entrypoint
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - logiflow-network

  # ---------------------------------------------------------------------------
  # DATABASE — PostgreSQL 16 (Hidden completely from public ports)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: logiflow-db-prod
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # REMOVED: Ports statement completely blocked to prevent internet hacking probes
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network

  # ---------------------------------------------------------------------------
  # REDIS 7.2 Cache Store (Network Blocked)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: logiflow-redis-prod
    restart: always
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    # REMOVED: Ports configuration array hidden from host router interfaces
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network

  # ---------------------------------------------------------------------------
  # CLOUD STORAGE — MinIO Local Cloud Replica S3 Node
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: logiflow-minio-prod
    restart: always
    command: server /data --console-address ":8900"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network
