name: logiflow

# Shared network and persistent storage definitions.
# These named volumes keep database, cache, and build artifacts alive across
# container restarts instead of relying on ephemeral local disk.
networks:
  logiflow-network:
    name: logiflow-network
    driver: bridge

volumes:
  postgres-data:
    name: logiflow-postgres-data
  redis-data:
    name: logiflow-redis-data
  minio-data:
    name: logiflow-minio-data
  backend-vendor:
    name: logiflow-backend-vendor
  frontend-node-modules:
    name: logiflow-frontend-node-modules
  frontend-next-cache:
    name: logiflow-frontend-next-cache

services:
  # Frontend application container.
  # The bind mount keeps local source changes visible inside the container,
  # while the named volumes preserve node_modules and Next.js cache.
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
    image: logiflow/frontend:dev
    container_name: logiflow-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      INTERNAL_BACKEND_URL: http://webserver
    depends_on:
      webserver:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - logiflow-network

  # PHP/Laravel application service.
  # The dependency conditions use service_healthy so the app waits for the
  # database, Redis, and object storage to be ready before it boots.
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: development
    image: logiflow/backend:dev
    container_name: logiflow-backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    expose:
      - "9000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${MINIO_BUCKET}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      FRONTEND_URL: ${FRONTEND_URL}
      REVERB_APP_ID: ${REVERB_APP_ID:-logiflow_app_id}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-logiflow_key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-logiflow_secret}
      REVERB_HOST: reverb
      REVERB_PORT: "8000"
      REVERB_SCHEME: http
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - logiflow-network

  # Reverb WebSocket service for Laravel broadcasting.
  # Keeping this in a separate container makes real-time events easier to run,
  # monitor, and scale independently from the main PHP app.
  reverb:
    image: logiflow/backend:dev
    container_name: logiflow-reverb
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8000"]
    volumes:
      - ../backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    expose:
      - "8000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      REVERB_APP_ID: ${REVERB_APP_ID:-logiflow_app_id}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-logiflow_key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-logiflow_secret}
      REVERB_HOST: 0.0.0.0
      REVERB_PORT: "8000"
      REVERB_SCHEME: http
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - logiflow-network

  # Nginx entrypoint for the stack.
  # The healthcheck uses a direct TCP probe so Compose can confirm the server
  # is accepting traffic before dependent services proceed.
  webserver:
    image: nginx:1.27-alpine
    container_name: logiflow-webserver
    restart: unless-stopped
    volumes:
      - ../backend:/var/www/html:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      backend:
        condition: service_started
      reverb:
        condition: service_started
    healthcheck:
      # FIXED: Native shell probe testing port 80 directly to ensure Nginx is accepting traffic cleanly
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/80 && exec 3>&-"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - logiflow-network

  # PostgreSQL database service.
  # The pg_isready probe allows Compose to wait until the database is ready
  # to accept connections rather than failing on startup races.
  db:
    image: postgres:16-alpine
    container_name: logiflow-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network

  # Redis cache and session store.
  # Authentication and append-only persistence are enabled to make the cache
  # safer and more durable in development and testing.
  redis:
    image: redis:7.2-alpine
    container_name: logiflow-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network

  # MinIO object storage service.
  # This provides S3-compatible storage locally and exposes both API and UI ports.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: logiflow-minio
    restart: unless-stopped
    command: server /data --console-address ":8900"
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:8900"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - logiflow-network

  # One-shot bucket initialization helper.
  # This container runs once, creates the required MinIO bucket, and exits.
  createbuckets:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: logiflow-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET} &&
      echo 'MinIO bucket [${MINIO_BUCKET}] ready.'
      "
    networks:
      - logiflow-network
